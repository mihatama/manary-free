<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manary | Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 28rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        box-shadow:
          0 25px 50px -12px rgba(15, 23, 42, 0.35),
          0 10px 30px -12px rgba(15, 23, 42, 0.25);
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 1rem;
      }
      p {
        line-height: 1.6;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The internet connection is unavailable. Please reconnect and refresh the page.</p>
    </main>
  </body>
</html>
