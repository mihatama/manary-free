version: 1
frontend:
  phases:
    preBuild:
      commands:
        - ./scripts/clear-proxy-and-install.sh npm install --no-progress --loglevel=error
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
